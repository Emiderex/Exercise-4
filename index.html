<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="item form_left">
        <img src="./assets/4888f534-79dc-49e1-8cf6-b89a4c39b47c.jpeg" alt="" srcset="" />
        <h2>For Individuals</h2>
        <p>
          Start benefiting from the wellness experience. For companies looking
          on increasing productivIty, and improving organization wellness
        </p>
      </section>

      <section class="item form_right">
        <form action="" class="form_item">
          <div class="form_item-group">
            <label for="firstname">First Name</label>
            <input type="text" name="firstname" id="" placeholder="Tolu" />
          </div>

          <div class="form_item-group">
            <label for="lastname">Last Name</label>
            <input type="text" name="lastname" id="" placeholder="Last name" />
          </div>

          <div class="form_item-group">
            <label for="">Gender</label>
            <select name="" id="">
              <option value="" disabled selected>Select here</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>

          <div class="form_item-group">
            <label for="birth">Date of birth</label>
            <input type="date" name="bith" id="" placeholder="Select here" />
          </div>

          <div class="form_item-group">
            <label for="weight">Weight(KG)</label>
            <input
              type="number"
              name="weight"
              id=""
              placeholder="Enter Weight"
            />
          </div>

          <div class="form_item-group">
            <label for="height">Height (CM)</label>
            <input
              type="number"
              name="height"
              id=""
              placeholder="Enter height here.."
            />
          </div>

          <div class="form_item-group">
            <label for="Activity Level"></label>
            <select name="" id="">
              <option value="" disabled selected>Select here</option>
              <option value="Male">Sedentary</option>
              <option value="Female">Moderate</option>
              <option value="Female">Heavy</option>
              <option value="Female">Very heavy</option>
            </select>
          </div>

          <div class="form-item_group">
            <label for="pword">Password</label>
            <input type="password" name="pword" id="" />
            <span class="form_icon"></span>
          </div>
          
          <button type="submit" class="form_button">Register</button>

          <p>
            Ву clicking Register, vou agree to our
            <a href="#">Terms of Use</a> and our
            <a href="#">Privacy Policy</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
